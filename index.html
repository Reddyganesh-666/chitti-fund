  .app-title { font-size:18.5px; font-weight:600; line-height:1.2; }
  .app-subtitle { font-size:12px; opacity:.75; }

  nav.tab-bar { border-bottom:1px solid var(--line); background:var(--card); overflow-x:auto; position:sticky; top:0; z-index:10; }
  nav.tab-bar .inner { display:flex; min-width:max-content; max-width:720px; margin:0 auto; }
  .tab-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 16px; min-width:82px; background:none; border:none; border-bottom:2px solid transparent; color:var(--ink-soft); cursor:pointer; position:relative; }
  .tab-btn.active { color:var(--navy); border-bottom-color:var(--red); }
  .tab-btn .label { font-size:11.5px; font-weight:500; line-height:1.1; }
  .tab-btn.active .label { font-weight:600; }
  .tab-badge { position:absolute; top:5px; right:14px; background:var(--red); color:#fff; font-size:9.5px; font-weight:700; border-radius:8px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

  .month-row { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; max-width:720px; margin:0 auto; }
  .month-nav-btn { padding:7px; background:var(--card); border:1px solid var(--line); border-radius:3px; color:var(--ink); cursor:pointer; display:flex; }
  .month-label-te { font-size:16px; font-weight:600; text-align:center; }
  .month-label-en { font-size:12px; color:var(--ink-soft); text-align:center; }

  main { padding: 4px 16px 40px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:4px; }
  .hero { border-left:4px solid var(--red); padding:20px; }
  .rows > *:not(:last-child) { border-bottom:1px solid var(--line); }

  .bi-label .te { font-size:11px; color:var(--ink-soft); font-weight:500; }
  .bi-label .en { font-size:9.5px; color:var(--ink-soft); opacity:.8; margin-top:1px; }
  .bi-label.lg .te { font-size:13px; }
  .bi-label.lg .en { font-size:11.5px; }

  .pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:2px; font-size:12px; font-weight:600; color:#FBF7EC; cursor:pointer; border:none; }
  .pill.paid { background:var(--green); }
  .pill.unpaid { background:var(--red); }

  .btn-primary { background:var(--navy); color:#fff; padding:9px 16px; border-radius:3px; font-size:13px; font-weight:600; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center; }
  .btn-ghost { color:var(--ink-soft); padding:7px 10px; font-size:12.5px; background:none; border:none; cursor:pointer; }

  .empty-state .en { font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .items-end { align-items:flex-end; }

  .justify-end { justify-content:flex-end; }

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function monthKeyOf(date) { return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0'); }

function monthKeyToDate(monthKey) {
  var parts = monthKey.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, 1);
}

function shiftMonth(monthKey, delta) {
  var d = monthKeyToDate(monthKey);
  d.setMonth(d.getMonth() + delta);
  return monthKeyOf(d);
}

function formatMonthParts(monthKey) {
  var parts = monthKey.split('-').map(Number);
  return { te: TELUGU_MONTHS[parts[1] - 1] + ' ' + parts[0], en: ENGLISH_MONTHS[parts[1] - 1] + ' ' + parts[0] };
}

function formatINR(amount) { return (Number(amount) || 0).toLocaleString('en-IN'); }

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function paymentKey(monthKey, groupId, memberId) { return monthKey + '::' + groupId + '::' + memberId; }
function winnerKey(monthKey, groupId) { return monthKey + '::' + groupId; }

function hasWon(groupId, memberId) {
  for (var k in state.winners) {
    var parts = k.split('::');
    if (parts[1] === groupId && state.winners[k].memberId === memberId) return true;
  }
  return false;
}

function buildReminderMessage(member, amount, monthParts, groupName) {
  return 'నమస్తే ' + member.name + ' గారు,\n' + groupName + ' - ' + monthParts.te + ' నెల చిటీ మొత్తం ₹' + formatINR(amount) + ' ఇంకా కట్టలేదు. దయచేసి వీలైనంత త్వరగా కట్టగలరు. ధన్యవాదాలు.\n\n' +
    'Hello ' + member.name + ',\nYour ' + groupName + ' chit payment of ₹' + formatINR(amount) + ' for ' + monthParts.en + ' is still pending. Please pay at the earliest. Thank you.';
}

function receiptNumber(paidDate, groupId, seatNo) {
  var compact = (paidDate || todayISO()).replace(/-/g, '');
  return compact + '-' + String(seatNo || 0).padStart(2, '0');
}

function ordinalEn(n) {
  var j = n % 10, k = n % 100;
  if (j === 1 && k !== 11) return n + 'st';
  if (j === 2 && k !== 12) return n + 'nd';
  if (j === 3 && k !== 13) return n + 'rd';
  return n + 'th';
}
function ordinalTe(n) { return n + 'వ'; }

function numberToWordsIndian(num) {
  num = Math.round(Number(num) || 0);
  if (num === 0) return 'Zero';
  var ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
    'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  var tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

  function twoDigits(n) {
    if (n < 20) return ones[n];
    return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
  }
  function threeDigits(n) {
    var h = Math.floor(n / 100), r = n % 100, s = '';
    if (h) s += ones[h] + ' Hundred';
    if (h && r) s += ' ';
    if (r) s += twoDigits(r);
    return s;
  }

  var crore = Math.floor(num / 10000000); num %= 10000000;
  var lakh = Math.floor(num / 100000); num %= 100000;
  var thousand = Math.floor(num / 1000); num %= 1000;
  var rest = num;

  var parts = [];
  if (crore) parts.push(threeDigits(crore) + ' Crore');
  if (lakh) parts.push(threeDigits(lakh) + ' Lakh');
  if (thousand) parts.push(threeDigits(thousand) + ' Thousand');
  if (rest) parts.push(threeDigits(rest));

  return parts.join(' ') || 'Zero';
}

function buildReceiptCopyText(member, group, monthParts, rec) {
  var methodLabel = (PAYMENT_METHODS.find(function (pm) { return pm.id === (rec.method || 'cash'); }) || PAYMENT_METHODS[0]).en;
  return 'మృదుల చిట్టీ ఫండ్ · Mrudhula Chitti Fund\n' +

    'తేదీ / Date: ' + rec.paidDate + '\n\n' +

    (group.chitNumber ? ('చిట్టీ నం / Chit No.: ' + ordinalTe(group.chitNumber) + ' · ' + ordinalEn(group.chitNumber) + '\n') : '') +
    'నెల / Month: ' + monthParts.te + ' · ' + monthParts.en + '\n' +

    'మొత్తం / Amount: ₹' + formatINR(rec.amount) + '\n' +

}

function toWhatsAppNumber(phone) {
  var digits = String(phone || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.length === 10) return '91' + digits;
  if (digits.length === 12 && digits.indexOf('91') === 0) return digits;
  return digits;
}

function whatsappReceiptLink(member, group, monthParts, rec) {
  var text = encodeURIComponent(buildReceiptCopyText(member, group, monthParts, rec));
  var waNumber = toWhatsAppNumber(member.phone);
  return waNumber ? ('https://wa.me/' + waNumber + '?text=' + text) : ('https://wa.me/?text=' + text);
}

function isIOSDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent || '');
}

function smsReceiptLink(member, group, monthParts, rec) {
  var text = encodeURIComponent(buildReceiptCopyText(member, group, monthParts, rec));
  var number = String((member.phone || '')).replace(/\D/g, '');
  var sep = isIOSDevice() ? '&' : '?';
  return 'sms:' + number + sep + 'body=' + text;
}

   Derived data
   ========================================================= */

function computeTotals() {
  var totalCollected = 0;
  var methodTotals = { cash: 0, phonepe: 0 };
  for (var k in state.payments) {
    if (state.payments[k].paid) {
      var amt = Number(state.payments[k].amount || 0);
      totalCollected += amt;
      methodTotals[state.payments[k].method === 'phonepe' ? 'phonepe' : 'cash'] += amt;
    }
  }
  var totalUsed = 0;
  for (var i = 0; i < state.usageLog.length; i++) totalUsed += Number(state.usageLog[i].amount || 0);
  return { totalCollected: totalCollected, totalUsed: totalUsed, balance: totalCollected - totalUsed, methodTotals: methodTotals };
}

function computeThisMonth(monthKey) {
  var collected = 0;
  var methodTotals = { cash: 0, phonepe: 0 };
  for (var k in state.payments) {
    if (k.indexOf(monthKey + '::') === 0 && state.payments[k].paid) {
      var amt = Number(state.payments[k].amount || 0);
      collected += amt;
      methodTotals[state.payments[k].method === 'phonepe' ? 'phonepe' : 'cash'] += amt;
    }
  }
  var used = 0;
  for (var i = 0; i < state.usageLog.length; i++) { if (state.usageLog[i].monthKey === monthKey) used += Number(state.usageLog[i].amount || 0); }
  return { collected: collected, used: used, methodTotals: methodTotals };
}

function computeGroupStats(monthKey) {
  return state.groups.map(function (g) {
    var total = g.members.length, paidCount = 0, collected = 0;
    g.members.forEach(function (m) {
      var rec = state.payments[paymentKey(monthKey, g.id, m.id)];
      if (rec && rec.paid) { paidCount++; collected += Number(rec.amount || 0); }
    });
    return { id: g.id, name: g.name, total: total, paidCount: paidCount, collected: collected };
  });
}

function computeUnpaid(monthKey) {
  var list = [];
  state.groups.forEach(function (g) {
    g.members.forEach(function (m) {
      var rec = state.payments[paymentKey(monthKey, g.id, m.id)];
      if (!(rec && rec.paid)) list.push({ id: m.id, name: m.name, seatNo: m.seatNo, monthlyAmount: m.monthlyAmount, groupId: g.id, groupName: g.name });
    });
  });
  return list;
}

function recentUsage() {
  return state.usageLog.slice().sort(function (a, b) { return b.date.localeCompare(a.date); }).slice(0, 3);
}

          '<div class="mono" style="font-size:16px;font-weight:700;margin-top:2px">₹' + formatINR(thisMonth.methodTotals.phonepe) + '</div>' +
        '</div>' +
        '<div class="card" style="padding:14px">' +
          '<div style="font-size:11px;color:var(--ink-soft)">మొత్తం నగదు / All-time Cash</div>' +
          '<div class="mono" style="font-size:16px;font-weight:700;margin-top:2px;color:var(--brass)">₹' + formatINR(totals.methodTotals.cash) + '</div>' +
        '</div>' +
        '<div class="card" style="padding:14px">' +
          '<div style="font-size:11px;color:var(--ink-soft)">మొత్తం PhonePe / All-time</div>' +
          '<div class="mono" style="font-size:16px;font-weight:700;margin-top:2px;color:var(--brass)">₹' + formatINR(totals.methodTotals.phonepe) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  if (groupStats.length > 0) {
    html += '<div>' + biLabel('గ్రూపుల వారీగా (ఈ నెల)', 'By group, this month') + '<div class="grid2" style="margin-top:8px">' +
      groupStats.map(function (g) {
        var status = g.total === 0 ? 'సభ్యులు లేరు' : (g.paidCount + ' / ' + g.total + ' కట్టారు');
        return '<div class="card" style="padding:14px">' +
          '<div style="font-size:13.5px;font-weight:600">' + esc(g.name) + '</div>' +
          '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px">' + esc(status) + '</div>' +
          '<div class="mono" style="font-size:13px;font-weight:600;margin-top:4px">₹' + formatINR(g.collected) + '</div></div>';
      }).join('') + '</div></div>';
  }

  if (recent.length > 0) {
    html += '<div>' + biLabel('ఇటీవలి వినియోగం', 'Recent usage') + '<div class="card rows" style="margin-top:8px">' +
      recent.map(function (e) {
        return '<div class="flex items-center justify-between row-pad"><div><div style="font-size:13px;font-weight:600">' + esc(e.description) + '</div>' +
          '<div class="mono" style="font-size:11px;color:var(--ink-soft)">' + esc(e.date) + '</div></div>' +
          '<div class="mono" style="font-size:13px;font-weight:600;color:var(--red)">₹' + formatINR(e.amount) + '</div></div>';
      }).join('') + '</div></div>';
  }

  html += '</div>';
  return html;
}

   Payments tab

function renderWinnerSection(group) {
  var key = winnerKey(state.selectedMonth, group.id);
  var w = state.winners[key];
  var isEditing = state.editingWinnerKey === key;
  var html = '<div class="card" style="padding:14px;border-left:4px solid var(--brass)">';

  if (isEditing) {
    html += biLabel('ఈ నెల విజేత', "This month's winner") + '<div class="stack" style="margin-top:10px;gap:10px">';
    html += '<select data-scope="winner-member-select" data-group="' + group.id + '"><option value="">-- సభ్యుడిని ఎంచుకోండి / Choose member --</option>' +
      group.members.map(function (m) {
        var sel = state.winnerMemberId === m.id ? ' selected' : '';
        return '<option value="' + m.id + '"' + sel + '>' + esc(m.name) + ' (సీటు ' + m.seatNo + ')</option>';
      }).join('') + '</select>';
    html += '<div style="max-width:160px"><div class="field-label">మొత్తం / Amount</div><input type="number" class="mono" data-scope="winner-amount" value="' + esc(state.winnerAmount) + '"></div>';
    html += '<div class="flex g2 justify-end items-center">';
    if (w) html += '<button class="btn-ghost" style="color:var(--red)" data-action="delete-winner" data-group-id="' + group.id + '">తీసివేయి / Remove</button>';
    html += '<button class="btn-ghost" data-action="cancel-edit-winner">రద్దు / Cancel</button>' +
      '<button class="btn-primary" data-action="save-winner" data-group-id="' + group.id + '">సేవ్ / Save</button></div>';
    html += '</div>';
  } else if (w) {
    var member = group.members.find(function (m) { return m.id === w.memberId; });
    html += '<div class="flex items-center justify-between">' +
      '<div>' + biLabel('ఈ నెల విజేత', "This month's winner") +
        '<div style="font-size:14.5px;font-weight:600;margin-top:4px">' + esc(member ? member.name : '—') + (member ? ' <span class="seat-note">(సీటు ' + member.seatNo + ')</span>' : '') + '</div>' +
        '<div class="mono" style="font-size:13px;color:var(--brass);font-weight:600;margin-top:2px">₹' + formatINR(w.amount) + '</div>' +
      '</div>' +
      '<button class="icon-btn" data-action="start-edit-winner" data-group-id="' + group.id + '">' + icon('pencil', 14) + '</button>' +
    '</div>';
  } else {
    html += biLabel('ఈ నెల విజేత', "This month's winner") +
      '<button class="btn-dashed" style="margin-top:8px" data-action="start-edit-winner" data-group-id="' + group.id + '">' + icon('plus', 14) + ' విజేతను ఎంచుకోండి / Select winner</button>';
  }
  html += '</div>';
  return html;
}

function renderWinnerHistory(group) {
  var entries = [];
  for (var k in state.winners) {
    var parts = k.split('::');
    if (parts[1] === group.id) {
      var member = group.members.find(function (m) { return m.id === state.winners[k].memberId; });
      entries.push({ monthKey: parts[0], name: member ? member.name : '—', seat: member ? member.seatNo : '', amount: state.winners[k].amount });
    }
  }
  if (entries.length === 0) return '';
  entries.sort(function (a, b) { return b.monthKey.localeCompare(a.monthKey); });
  var html = '<div style="margin-top:16px">' + biLabel('విజేతల చరిత్ర', 'Winners so far') + '<div class="card rows" style="margin-top:8px">';
  html += entries.map(function (e) {
    var mp = formatMonthParts(e.monthKey);
    return '<div class="flex items-center justify-between row-pad"><div><div style="font-size:13px;font-weight:600">' + esc(e.name) + (e.seat ? ' <span class="seat-note">(సీటు ' + e.seat + ')</span>' : '') + '</div>' +
      '<div class="mono seat-note">' + esc(mp.en) + '</div></div>' +
      '<div class="mono" style="font-size:13px;font-weight:600;color:var(--brass)">₹' + formatINR(e.amount) + '</div></div>';
  }).join('') + '</div></div>';
  return html;
}

function renderPayments() {
  var groups = state.groups;
  if (groups.length === 0) {
    return '<div class="container" style="padding-top:4px;padding-bottom:32px">' +
      emptyState('గ్రూపులు లేవు', 'No groups yet', 'సభ్యులు ట్యాబ్‌లో గ్రూప్ జోడించండి / Add a group in the Members tab') + '</div>';
  }
  var group = groups.find(function (g) { return g.id === state.selectedGroupId; }) || groups[0];

  var chips = '<div class="chip-scroll">' + groups.map(function (g) {
    return '<button class="group-chip' + (g.id === group.id ? ' active' : '') + '" data-action="select-group" data-group-id="' + g.id + '">' + esc(g.name) + '</button>';
  }).join('') + '</div>';

  var body;
  if (group.members.length === 0) {
    body = emptyState('ఈ గ్రూప్‌లో సభ్యులు లేరు', 'No members in this group yet', 'సభ్యులు ట్యాబ్‌లో జోడించండి / Add members in the Members tab');
  } else {
    var collected = 0, expected = 0;
    var methodTotals = { cash: 0, phonepe: 0 };
    var rows = group.members.map(function (m) {
      var rec = state.payments[paymentKey(state.selectedMonth, group.id, m.id)];
      var isPaid = !!(rec && rec.paid);
      expected += Number(m.monthlyAmount || 0);
      if (isPaid) {
        collected += Number(rec.amount || 0);
        var mth = rec.method === 'phonepe' ? 'phonepe' : 'cash';
        methodTotals[mth] += Number(rec.amount || 0);
      }
      var isEditing = state.editingPaymentId === m.id;
      var amountShown = isPaid ? rec.amount : m.monthlyAmount;
      var won = hasWon(group.id, m.id);
      var methodLabel = isPaid ? (PAYMENT_METHODS.find(function (pm) { return pm.id === (rec.method || 'cash'); }) || PAYMENT_METHODS[0]).te : '';
      var editBtn = isPaid ? '<button class="icon-btn" data-action="' + (isEditing ? 'cancel-edit-payment' : 'start-edit-payment') + '" data-group-id="' + group.id + '" data-member-id="' + m.id + '" data-amount="' + rec.amount + '" data-date="' + rec.paidDate + '" data-method="' + (rec.method || 'cash') + '">' + icon('pencil', 14) + '</button>' : '';
      var receiptBtn = isPaid ? '<button class="icon-btn" data-action="show-receipt" data-group-id="' + group.id + '" data-member-id="' + m.id + '" title="రసీదు / Receipt">' + icon('receipt', 14) + '</button>' : '';
      var rightControl = isPaid ?
        '<button data-action="toggle-payment" data-group-id="' + group.id + '" data-member-id="' + m.id + '"><span class="pill paid mono">కట్టారు / Paid</span></button>' :
        '<div class="flex g1">' + PAYMENT_METHODS.map(function (pm) {
          return '<button class="method-btn" data-action="mark-paid-method" data-group-id="' + group.id + '" data-member-id="' + m.id + '" data-method="' + pm.id + '">' + esc(pm.te) + '</button>';
        }).join('') + '</div>';
      var row = '<div class="row-pad">' +
        '<div class="flex items-center justify-between g3 wrap">' +
          '<div style="min-width:0"><div style="font-size:14.5px;font-weight:600">' + esc(m.name) + '</div>' +
          '<div class="mono seat-note">సీటు ' + m.seatNo + ' · ₹' + formatINR(amountShown) + (isPaid ? ' · ' + esc(methodLabel) : '') + (won ? ' · <span style="color:var(--brass);font-weight:600">గెలిచారు ✓</span>' : '') + '</div></div>' +
          '<div class="flex items-center g2">' + receiptBtn + editBtn + rightControl + '</div>' +
        '</div>';
      if (isEditing) {
        row += '<div class="stack" style="gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' +
          '<div class="flex items-end g2 wrap">' +
            '<div><div class="field-label">మొత్తం / Amount</div><input type="number" class="mono" style="width:100px" data-scope="edit-amount" value="' + esc(state.editAmount) + '"></div>' +
            '<div><div class="field-label">తేదీ / Date</div><input type="date" class="mono" data-scope="edit-date" value="' + esc(state.editDate) + '"></div>' +
          '</div>' +
          '<div><div class="field-label">ఎలా కట్టారు / Paid via</div><div class="flex g2">' + PAYMENT_METHODS.map(function (pm) {
            return '<button class="cat-btn' + (state.editMethod === pm.id ? ' active' : '') + '" data-action="set-edit-method" data-method="' + pm.id + '">' + esc(pm.te) + '</button>';
          }).join('') + '</div></div>' +
          '<div class="flex g2 justify-end">' +
            '<button class="btn-primary" data-action="save-edit-payment" data-group-id="' + group.id + '" data-member-id="' + m.id + '">సేవ్ / Save</button>' +
            '<button class="btn-ghost" data-action="cancel-edit-payment">రద్దు / Cancel</button>' +
          '</div>' +
        '</div>';
      }
      row += '</div>';
      return row;
    }).join('');
    body = '<div class="card rows">' + rows + '</div>' +
      '<div class="card row-pad" style="margin-top:16px">' +
        '<div class="flex items-center justify-between">' +
          biLabel('ఈ నెల వసూలు', 'Collected this month') +
          '<div class="mono" style="font-size:16px;font-weight:700;color:var(--navy)">₹' + formatINR(collected) + ' <span style="font-size:12px;color:var(--ink-soft);font-weight:500">/ ₹' + formatINR(expected) + '</span></div>' +
        '</div>' +
        (collected > 0 ? '<div class="flex g4" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">' +
          '<div style="font-size:11.5px;color:var(--ink-soft)">నగదు Cash: <span class="mono" style="font-weight:600;color:var(--ink)">₹' + formatINR(methodTotals.cash) + '</span></div>' +
          '<div style="font-size:11.5px;color:var(--ink-soft)">PhonePe: <span class="mono" style="font-weight:600;color:var(--ink)">₹' + formatINR(methodTotals.phonepe) + '</span></div>' +
        '</div>' : '') +
      '</div>' + renderWinnerHistory(group);
  }

  return '<div class="container stack" style="padding-top:4px;padding-bottom:32px">' + chips + renderWinnerSection(group) + body + '</div>';
}

/* =========================================================
   Reminders tab

function renderReminders() {
  var unpaid = computeUnpaid(state.selectedMonth);
  var monthParts = formatMonthParts(state.selectedMonth);
  var today = new Date();
  var currentRealMonthKey = monthKeyOf(today);
  var comparison = state.selectedMonth === currentRealMonthKey ? 'current' : (monthKeyToDate(state.selectedMonth) < monthKeyToDate(currentRealMonthKey) ? 'past' : 'future');
  var reminderDue = comparison === 'past' || (comparison === 'current' && today.getDate() >= 15);

  if (unpaid.length === 0) {
    return '<div class="container" style="padding-top:4px;padding-bottom:32px">' + emptyState('అందరూ కట్టేశారు!', 'Everyone has paid this month.', '') + '</div>';
  }

  var html = '<div class="container stack" style="padding-top:4px;padding-bottom:32px">';
  html += '<div class="card row-pad" style="font-size:12.5px;color:var(--ink-soft);line-height:1.5">మెసేజ్ కాపీ చేసి మీరే వాట్సాప్‌లో పంపుకోవాలి — యాప్ ఆటోమేటిక్‌గా పంపదు.<br>Copy the message and send it yourself on WhatsApp — the app doesn\'t send it automatically.</div>';
  if (!reminderDue && comparison === 'current') {
    html += '<div style="font-size:12px;color:var(--brass)">సాధారణంగా 15వ తేదీ తర్వాత రిమైండర్లు పంపిస్తారు / Reminders are usually sent after the 15th</div>';
  }
  html += unpaid.map(function (m) {
    var isCopied = state.copiedId === m.id;
    var showDue = comparison === 'past' || reminderDue;
    return '<div class="card flex items-center justify-between g3 row-pad">' +
      '<div style="min-width:0"><div style="font-size:14.5px;font-weight:600">' + esc(m.name) + '</div>' +
      '<div class="mono" style="font-size:12px;color:var(--ink-soft)">' + esc(m.groupName) + ' · సీటు ' + m.seatNo + ' · ₹' + formatINR(m.monthlyAmount) + '</div>' +
      (showDue ? '<span style="font-size:10.5px;font-weight:700;color:var(--red)">రిమైండర్ డ్యూ / Reminder due</span>' : '') + '</div>' +
      '<button data-action="copy-reminder" data-member-id="' + m.id + '" data-group-id="' + m.groupId + '" style="flex-shrink:0;background:' + (isCopied ? 'var(--green)' : 'var(--navy)') + ';color:#fff;padding:8px 13px;border-radius:3px;font-size:12.5px;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px">' +
        icon(isCopied ? 'check' : 'copy', 13) + (isCopied ? 'కాపీ అయ్యింది' : 'కాపీ') + '</button>' +
    '</div>';
  }).join('');
  html += '</div>';
  return html;
}

function renderUsage() {
  var totals = computeTotals();
  var sorted = state.usageLog.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });

  var html = '<div class="container stack" style="padding-top:4px;padding-bottom:32px">';
  html += '<div class="card flex items-center justify-between row-pad">' + biLabel('మొత్తం వినియోగం', 'Total used') +
    '<div class="mono" style="font-size:16px;font-weight:700;color:var(--red)">₹' + formatINR(totals.totalUsed) + '</div></div>';

  html += '<button class="btn-primary w-full" data-action="toggle-usage-form">' + icon('plus', 15) + ' కొత్త ఎంట్రీ జోడించండి / Add entry</button>';

  if (state.usageFormOpen) {
    var f = state.usageForm;
    html += '<div class="card stack" style="padding:16px">' +
      '<div><div class="field-label">వివరణ / Description</div><input type="text" data-scope="usage-desc" value="' + esc(f.desc) + '" placeholder="ఉదా: మోహన్‌కి రౌండ్ చెల్లింపు"></div>' +
      '<div class="flex g3">' +
        '<div style="flex:1"><div class="field-label">మొత్తం / Amount</div><input type="number" class="mono" data-scope="usage-amount" value="' + esc(f.amount) + '"></div>' +
        '<div style="flex:1"><div class="field-label">తేదీ / Date</div><input type="date" class="mono" data-scope="usage-date" value="' + esc(f.date) + '"></div>' +
      '</div>' +
      '<div><div class="field-label">రకం / Type</div><div class="flex g2 wrap">' +
        USAGE_CATEGORIES.map(function (c) { return '<button class="cat-btn' + (f.category === c.id ? ' active' : '') + '" data-action="set-usage-category" data-cat="' + c.id + '">' + esc(c.te) + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="flex g2 justify-end"><button class="btn-ghost" data-action="cancel-usage-form">రద్దు / Cancel</button><button class="btn-primary" data-action="submit-usage">సేవ్ / Save</button></div>' +
    '</div>';
  }

  if (sorted.length === 0) {
    html += emptyState('ఇంకా ఎంట్రీలు లేవు', 'No entries yet', '');
  } else {
    html += '<div class="card rows">' + sorted.map(function (e) {
      var cat = USAGE_CATEGORIES.find(function (c) { return c.id === e.category; }) || USAGE_CATEGORIES[3];
      var armed = state.confirmDeleteUsageId === e.id;
      var delBtn = armed ?
        '<div class="flex g2"><button class="icon-btn" style="color:var(--red)" data-action="delete-usage" data-id="' + e.id + '">' + icon('check', 15) + '</button><button class="icon-btn" data-action="cancel-delete-usage">' + icon('x', 15) + '</button></div>' :
        '<button class="icon-btn" data-action="confirm-delete-usage" data-id="' + e.id + '">' + icon('trash', 14) + '</button>';
      return '<div class="flex items-center justify-between g3 row-pad">' +
        '<div style="min-width:0"><div style="font-size:14px;font-weight:600">' + esc(e.description) + '</div>' +
        '<div class="mono" style="font-size:11.5px;color:var(--ink-soft)">' + esc(e.date) + ' · ' + esc(cat.te) + '</div></div>' +
        '<div class="flex items-center g3"><div class="mono" style="font-size:14px;font-weight:700;color:var(--red)">₹' + formatINR(e.amount) + '</div>' + delBtn + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  html += '</div>';
  return html;
}

        '</div>';
      } else {
        inner += '<div class="flex items-center justify-between">' +
          '<div>' + biLabel('చిటీ మొత్తం', 'Chit amount (auto-fills winner payouts)') +
            '<div class="mono" style="font-size:14px;font-weight:600;margin-top:3px;color:var(--brass)">' + (g.chitAmount ? '₹' + formatINR(g.chitAmount) : 'సెట్ చేయలేదు / not set') + '</div></div>' +

      var isEditingChitNo = state.editingChitNumberGroupId === g.id;

function render() {

  if (!state.loaded) {
    app.innerHTML = '<div style="min-height:360px;display:flex;align-items:center;justify-content:center">' +

    return;
  }
  var html = '<div class="no-print">' + renderHeader() + renderTabBar();
  if (state.activeTab !== 'members') html += renderMonthSelector();
  if (state.showInstallBanner) {
    html += '<div class="install-banner"><span>మీ ఫోన్‌లో హోమ్ స్క్రీన్‌కు యాడ్ చేయండి / Add this to your home screen</span><button data-action="trigger-install">ఇన్‌స్టాల్ / Install</button></div>';
  }

}

/* =========================================================
   Actions
   ========================================================= */

function markPaid(groupId, memberId, amount, date, method) {
  var key = paymentKey(state.selectedMonth, groupId, memberId);
  var existing = state.payments[key];
  state.payments[key] = { paid: true, amount: Number(amount), paidDate: date, method: method || (existing && existing.method) || 'cash' };
  persistPayments();
}
function markUnpaid(groupId, memberId) {
  var key = paymentKey(state.selectedMonth, groupId, memberId);
  delete state.payments[key];
  persistPayments();
}

function exportToExcel() {
  if (typeof XLSX === 'undefined') {
    state.saveErrorMsg = 'Excel లైబ్రరీ లోడ్ కాలేదు — ఒకసారి ఇంటర్నెట్‌తో తెరిచి మళ్ళీ ప్రయత్నించండి / Excel library not loaded — open once online and try again';
    render();
    setTimeout(function () { state.saveErrorMsg = ''; render(); }, 3500);
    return;
  }

  var wb = XLSX.utils.book_new();
  var totals = computeTotals();

  var summaryRows = [
    ['మృదుల చిట్టీ ఫండ్ · Mrudhula Chitti Fund'],
    ['Exported', todayISO()],
    [],
    ['మొత్తం వసూలు · Total collected', totals.totalCollected],
    ['మొత్తం వినియోగం · Total used', totals.totalUsed],
    ['నిలవ · Balance in hand', totals.balance],
    [],
    ['గ్రూప్ · Group', 'చిటీ మొత్తం · Chit amount', 'సభ్యులు · Members', 'ఈ నెల వసూలు · Collected this month'],
  ];
  computeGroupStats(state.selectedMonth).forEach(function (g) {
    var gFull = state.groups.find(function (gr) { return gr.id === g.id; });
    summaryRows.push([g.name, (gFull && gFull.chitAmount) ? gFull.chitAmount : '', g.paidCount + ' / ' + g.total, g.collected]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Summary సారాంశం');

  state.groups.forEach(function (g) {
    var monthSet = {};
    Object.keys(state.payments).forEach(function (k) {
      var parts = k.split('::');
      if (parts[1] === g.id) monthSet[parts[0]] = true;
    });
    monthSet[state.selectedMonth] = true;
    var months = Object.keys(monthSet).sort();

    var header = ['సీటు Seat', 'పేరు Name', 'ఫోన్ Phone', 'నెలవారీ మొత్తం Monthly Amount'].concat(
      months.map(function (mk) { return formatMonthParts(mk).en; })
    );
    var rows = [header];
    g.members.forEach(function (m) {
      var row = [m.seatNo, m.name, m.phone || '', m.monthlyAmount];
      months.forEach(function (mk) {
        var rec = state.payments[paymentKey(mk, g.id, m.id)];
        row.push(rec && rec.paid ? rec.amount : '');
      });
      rows.push(row);
    });
    var sheetName = (g.name + '').substring(0, 31);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  });

  var usageHeader = ['తేదీ Date', 'రకం Category', 'వివరణ Description', 'మొత్తం Amount'];
  var usageBody = state.usageLog.slice().sort(function (a, b) { return a.date.localeCompare(b.date); }).map(function (e) {
    var cat = USAGE_CATEGORIES.find(function (c) { return c.id === e.category; });
    return [e.date, cat ? cat.en : e.category, e.description, e.amount];
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([usageHeader].concat(usageBody)), 'Usage వినియోగం');

  var winnerHeader = ['నెల Month', 'గ్రూప్ Group', 'సీటు Seat', 'విజేత Winner', 'మొత్తం Amount'];
  var winnerRows = [];
  for (var wk in state.winners) {
    var wparts = wk.split('::');
    var wg = state.groups.find(function (g) { return g.id === wparts[1]; });
    var wm = wg && wg.members.find(function (m) { return m.id === state.winners[wk].memberId; });
    winnerRows.push([formatMonthParts(wparts[0]).en, wg ? wg.name : wparts[1], wm ? wm.seatNo : '', wm ? wm.name : '—', state.winners[wk].amount]);
  }
  winnerRows.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([winnerHeader].concat(winnerRows)), 'Winners విజేతలు');

  XLSX.writeFile(wb, 'chitti-fund-' + todayISO() + '.xlsx');
}

function handleClick(e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;
  var groupId = el.dataset.groupId;
  var memberId = el.dataset.memberId;

  switch (action) {
    case 'export-excel':
      exportToExcel();
      return; // no state mutation, skip the render() at the bottom
    case 'set-tab':
      state.activeTab = el.dataset.tab;
      break;
    case 'prev-month':
      state.selectedMonth = shiftMonth(state.selectedMonth, -1);
      break;
    case 'next-month':
      state.selectedMonth = shiftMonth(state.selectedMonth, 1);
      break;
    case 'select-group':
      state.selectedGroupId = groupId;
      break;
    case 'toggle-payment': {
      var rec = state.payments[paymentKey(state.selectedMonth, groupId, memberId)];
      if (rec && rec.paid) markUnpaid(groupId, memberId);
      break;
    }
    case 'mark-paid-method': {
      var group = state.groups.find(function (g) { return g.id === groupId; });
      var member = group && group.members.find(function (m) { return m.id === memberId; });
      if (member) markPaid(groupId, memberId, member.monthlyAmount, todayISO(), el.dataset.method);
      break;
    }
    case 'start-edit-payment':
      state.editingPaymentId = memberId;
      state.editAmount = String(el.dataset.amount || '');
      state.editDate = el.dataset.date || todayISO();
      state.editMethod = el.dataset.method || 'cash';
      break;
    case 'cancel-edit-payment':
      state.editingPaymentId = null;
      break;
    case 'set-edit-method':
      state.editMethod = el.dataset.method;
      break;
    case 'save-edit-payment':
      markPaid(groupId, memberId, state.editAmount, state.editDate, state.editMethod);
      state.editingPaymentId = null;
      break;
    case 'copy-reminder': {
      var g2 = state.groups.find(function (g) { return g.id === groupId; });
      var m2 = g2 && g2.members.find(function (m) { return m.id === memberId; });
      if (m2) {
        var msg = buildReminderMessage(m2, m2.monthlyAmount, formatMonthParts(state.selectedMonth), g2.name);
        copyText(msg);
        state.copiedId = memberId;
        setTimeout(function () { if (state.copiedId === memberId) { state.copiedId = null; render(); } }, 2000);
      }
      break;
    }
    case 'toggle-usage-form':
      state.usageFormOpen = !state.usageFormOpen;
      break;
    case 'cancel-usage-form':
      state.usageFormOpen = false;
      state.usageForm = { desc: '', amount: '', category: USAGE_CATEGORIES[0].id, date: todayISO() };
      break;
    case 'set-usage-category':
      state.usageForm.category = el.dataset.cat;
      break;
    case 'submit-usage': {
      var uf = state.usageForm;
      if (!uf.desc.trim() || !uf.amount || Number(uf.amount) <= 0) break;
      state.usageLog.push({ id: genId(), description: uf.desc.trim(), amount: Number(uf.amount), category: uf.category, date: uf.date, monthKey: uf.date.slice(0, 7) });
      persistUsage();
      state.usageFormOpen = false;
      state.usageForm = { desc: '', amount: '', category: USAGE_CATEGORIES[0].id, date: todayISO() };
      break;
    }
    case 'confirm-delete-usage':
      state.confirmDeleteUsageId = el.dataset.id;
      break;
    case 'cancel-delete-usage':
      state.confirmDeleteUsageId = null;
      break;
    case 'delete-usage':
      state.usageLog = state.usageLog.filter(function (e) { return e.id !== el.dataset.id; });
      persistUsage();
      state.confirmDeleteUsageId = null;
      break;
    case 'toggle-group-expand':
      state.expandedGroupId = state.expandedGroupId === groupId ? null : groupId;
      break;
    case 'toggle-add-group-form':
      state.showAddGroup = true;
      break;
    case 'cancel-add-group':
      state.showAddGroup = false;
      state.newGroupName = '';
      break;
    case 'submit-add-group':
      if (!state.newGroupName.trim()) break;
      state.groups.push({ id: genId(), name: state.newGroupName.trim(), note: '', members: [] });
      persistGroups();
      state.newGroupName = '';
      state.showAddGroup = false;
      break;
    case 'toggle-member-form':
      ensureMemberForm(groupId).show = true;
      break;
    case 'cancel-add-member':
      state.memberForms[groupId] = { name: '', phone: '', amount: '', show: false };
      break;
    case 'submit-add-member': {
      var mf = ensureMemberForm(groupId);
      if (!mf.name.trim() || !mf.amount || Number(mf.amount) <= 0) break;
      var grp = state.groups.find(function (g) { return g.id === groupId; });
      var nextSeat = grp.members.reduce(function (mx, mm) { return Math.max(mx, mm.seatNo || 0); }, 0) + 1;
      grp.members.push({ id: genId(), seatNo: nextSeat, name: mf.name.trim(), phone: mf.phone.trim(), monthlyAmount: Number(mf.amount) });
      persistGroups();
      state.memberForms[groupId] = { name: '', phone: '', amount: '', show: false };
      break;
    }
    case 'confirm-delete-member':
      state.confirmDeleteMember = { groupId: groupId, memberId: memberId };
      break;
    case 'cancel-delete-member':
      state.confirmDeleteMember = null;
      break;
    case 'start-edit-member':
      state.editingMemberId = memberId;
      state.editMemberName = el.dataset.name || '';
      state.editMemberPhone = el.dataset.phone || '';
      state.editMemberAmount = el.dataset.amount || '';
      break;
    case 'cancel-edit-member':
      state.editingMemberId = null;
      break;
    case 'save-edit-member': {
      if (!state.editMemberName.trim() || !state.editMemberAmount || Number(state.editMemberAmount) <= 0) break;
      var geditGrp = state.groups.find(function (g) { return g.id === groupId; });
      var editMember = geditGrp && geditGrp.members.find(function (m) { return m.id === memberId; });
      if (editMember) {
        editMember.name = state.editMemberName.trim();
        editMember.phone = state.editMemberPhone.trim();
        editMember.monthlyAmount = Number(state.editMemberAmount);
        persistGroups();
      }
      state.editingMemberId = null;
      break;
    }
    case 'delete-member': {
      var gg = state.groups.find(function (g) { return g.id === groupId; });
      if (gg) gg.members = gg.members.filter(function (m) { return m.id !== memberId; });
      persistGroups();
      state.confirmDeleteMember = null;
      break;
    }
    case 'start-edit-winner': {
      var wk = winnerKey(state.selectedMonth, groupId);
      state.editingWinnerKey = wk;
      var existingW = state.winners[wk];
      var wGroupForFill = state.groups.find(function (g) { return g.id === groupId; });
      state.winnerMemberId = existingW ? existingW.memberId : '';
      state.winnerAmount = existingW ? String(existingW.amount) : ((wGroupForFill && wGroupForFill.chitAmount) ? String(wGroupForFill.chitAmount) : '');
      break;
    }
    case 'cancel-edit-winner':
      state.editingWinnerKey = null;
      break;
    case 'save-winner': {
      if (!state.winnerMemberId || !state.winnerAmount || Number(state.winnerAmount) <= 0) break;
      var wk2 = winnerKey(state.selectedMonth, groupId);
      var wGroup = state.groups.find(function (g) { return g.id === groupId; });
      var wMember = wGroup && wGroup.members.find(function (m) { return m.id === state.winnerMemberId; });
      state.winners[wk2] = { memberId: state.winnerMemberId, amount: Number(state.winnerAmount) };
      persistWinners();
      // keep a matching usage-log entry in sync, so the payout shows in వినియోగం/balance too
      var desc = (wMember ? wMember.name : '') + ' గారికి ' + (wGroup ? wGroup.name : '') + ' చిటీ' + (wMember ? ' (సీటు ' + wMember.seatNo + ')' : '');
      var linked = state.usageLog.find(function (en) { return en.linkedWinnerKey === wk2; });
      if (linked) {
        linked.amount = Number(state.winnerAmount);
        linked.description = desc;
      } else {
        state.usageLog.push({ id: genId(), description: desc, amount: Number(state.winnerAmount), category: 'payout', date: todayISO(), monthKey: state.selectedMonth, linkedWinnerKey: wk2 });
      }
      persistUsage();
      state.editingWinnerKey = null;
      break;
    }
    case 'delete-winner': {
      var wk3 = winnerKey(state.selectedMonth, groupId);
      delete state.winners[wk3];
      persistWinners();
      state.usageLog = state.usageLog.filter(function (en) { return en.linkedWinnerKey !== wk3; });
      persistUsage();
      state.editingWinnerKey = null;
      break;
    }
    case 'start-edit-chit-amount': {
      state.editingChitAmountGroupId = groupId;
      var gForAmt = state.groups.find(function (g) { return g.id === groupId; });
      state.chitAmountInput = (gForAmt && gForAmt.chitAmount) ? String(gForAmt.chitAmount) : '';
      break;
    }
    case 'cancel-edit-chit-amount':
      state.editingChitAmountGroupId = null;
      break;
    case 'save-chit-amount': {
      var gToSet = state.groups.find(function (g) { return g.id === groupId; });
      if (gToSet) {
        gToSet.chitAmount = Number(state.chitAmountInput) || 0;
        persistGroups();
      }
      state.editingChitAmountGroupId = null;
      break;
    }
    case 'start-edit-chit-number': {
      state.editingChitNumberGroupId = groupId;
      var gForNo = state.groups.find(function (g) { return g.id === groupId; });
      state.chitNumberInput = (gForNo && gForNo.chitNumber) ? String(gForNo.chitNumber) : '';
      break;
    }
    case 'cancel-edit-chit-number':
      state.editingChitNumberGroupId = null;
      break;
    case 'save-chit-number': {
      var gToSetNo = state.groups.find(function (g) { return g.id === groupId; });
      if (gToSetNo) {
        gToSetNo.chitNumber = Number(state.chitNumberInput) || 0;
        persistGroups();
      }
      state.editingChitNumberGroupId = null;
      break;
    }
    case 'trigger-install':
      if (state.installEvent) {
        state.installEvent.prompt();
        state.installEvent.userChoice.finally(function () { state.installEvent = null; state.showInstallBanner = false; render(); });
      }
      break;
    case 'show-receipt':
      state.receiptFor = { groupId: groupId, memberId: memberId };
      state.receiptCopied = false;
      break;
    case 'close-receipt':
    case 'close-receipt-backdrop':
      state.receiptFor = null;
      break;
    case 'print-receipt':
      window.print();
      return; // no state change, skip re-render
    case 'copy-receipt': {
      var rGroup = state.groups.find(function (g) { return g.id === groupId; });
      var rMember = rGroup && rGroup.members.find(function (m) { return m.id === memberId; });
      var rRec = state.payments[paymentKey(state.selectedMonth, groupId, memberId)];
      if (rGroup && rMember && rRec) {
        copyText(buildReceiptCopyText(rMember, rGroup, formatMonthParts(state.selectedMonth), rRec));
        state.receiptCopied = true;
        setTimeout(function () { state.receiptCopied = false; render(); }, 2000);
      }
      break;
    }
    case 'send-whatsapp-receipt': {
      var wGroup = state.groups.find(function (g) { return g.id === groupId; });
      var wMember = wGroup && wGroup.members.find(function (m) { return m.id === memberId; });
      var wRec = state.payments[paymentKey(state.selectedMonth, groupId, memberId)];
      if (wGroup && wMember && wRec) {
        window.open(whatsappReceiptLink(wMember, wGroup, formatMonthParts(state.selectedMonth), wRec), '_blank');
      }
      return; // no state change, skip re-render
    }
    case 'send-sms-receipt': {
      var sGroup = state.groups.find(function (g) { return g.id === groupId; });
      var sMember = sGroup && sGroup.members.find(function (m) { return m.id === memberId; });
      var sRec = state.payments[paymentKey(state.selectedMonth, groupId, memberId)];
      if (sGroup && sMember && sRec) {
        window.location.href = smsReceiptLink(sMember, sGroup, formatMonthParts(state.selectedMonth), sRec);
      }
      return; // no state change, skip re-render
    }
    case 'noop':
      break;
  }
  render();
}

function handleInput(e) {
  var el = e.target;
  var scope = el.dataset.scope;
  if (!scope) return;
  var val = el.value;
  switch (scope) {
    case 'edit-amount': state.editAmount = val; break;
    case 'edit-date': state.editDate = val; break;
    case 'usage-desc': state.usageForm.desc = val; break;
    case 'usage-amount': state.usageForm.amount = val; break;
    case 'usage-date': state.usageForm.date = val; break;
    case 'new-group-name': state.newGroupName = val; break;
    case 'member-name': ensureMemberForm(el.dataset.group).name = val; break;
    case 'member-phone': ensureMemberForm(el.dataset.group).phone = val; break;
    case 'member-amount': ensureMemberForm(el.dataset.group).amount = val; break;
    case 'edit-member-name': state.editMemberName = val; break;
    case 'edit-member-phone': state.editMemberPhone = val; break;
    case 'edit-member-amount': state.editMemberAmount = val; break;
    case 'winner-member-select': state.winnerMemberId = val; break;
    case 'winner-amount': state.winnerAmount = val; break;
    case 'chit-amount-input': state.chitAmountInput = val; break;
    case 'chit-number-input': state.chitNumberInput = val; break;
  }
  /* deliberately no render() here — a full innerHTML re-render on every
     keystroke would reset input focus/cursor. state stays in sync silently
     and is read by the next click action (Save/Submit). */
}

function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { legacyCopy(text); });
    } else {
      legacyCopy(text);
    }
  } catch (e) { legacyCopy(text); }
}
function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { /* clipboard unavailable */ }
}

/* =========================================================
   Init
   ========================================================= */

document.getElementById('app').addEventListener('click', handleClick);
document.getElementById('app').addEventListener('input', handleInput);
document.getElementById('app').addEventListener('change', handleInput);

loadState();
render();

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  state.installEvent = e;
  state.showInstallBanner = true;
  render();
});
window.addEventListener('appinstalled', function () {
  state.showInstallBanner = false;
  state.installEvent = null;
  render();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  });
}
</script>
